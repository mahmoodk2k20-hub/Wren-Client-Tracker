<!DOCTYPE html>
<!--
  CLIENT HUB — the page layout.
  The pages themselves are drawn by the files in js/pages/.
  See HOW-TO-EDIT.md for a map of every file.
-->
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Client Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="img/homescreen_icon.png">
  <link rel="icon" href="img/website_icon.png">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Top bar: title, page buttons, new customer -->
  <header>
    <div class="brand">Client Tracker<small id="status">Loading…</small></div>
    <nav>
      <button data-view="today"     onclick="showPage('today')">Today</button>
      <button data-view="customers" onclick="showPage('customers')">Customers</button>
      <button data-view="tracking"  onclick="showPage('tracking')">Tracking</button>
    </nav>
    <button class="btn-primary" onclick="newCustomerDialog()">+ New customer</button>
        <button class="btn-small" onclick="signOut()">Sign out</button>
  </header>

  <!-- The current page is drawn in here -->
  <main id="app"></main>

  <!-- Customer panel and pop-ups are drawn in here -->
  <div id="modal"></div>

  <!-- Scripts: order matters (settings first, app last) -->
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/customer-rules.js"></script>
  <script src="js/pages/today.js"></script>
  <script src="js/pages/customers.js"></script>
  <script src="js/pages/tracking.js"></script>
  <script src="js/pages/customer-page.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
